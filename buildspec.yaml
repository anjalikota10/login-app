version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.1
    commands:
      - echo "[Install] Nothing extra to install for plain PHP app"

  pre_build:
    commands:
      - echo "[Pre‑Build] $(date)"

  build:
    commands:
      - echo "[Build] Nothing to compile for PHP app"

  post_build:
    commands:
      - echo "[Post‑Build] Completed at $(date)"

artifacts:
  files:
    - '**/*'          # send all repo files to CodeDeploy
  discard-paths: yes  # they will be flattened one level
